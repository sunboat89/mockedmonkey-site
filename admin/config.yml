backend:
  name: github
  repo: sunboat89/mockedmonkey-site
  branch: main
  # Set after deploying the OAuth worker (see README section "CMS setup").
  base_url: https://REPLACE-WITH-YOUR-WORKER-URL

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "shows"
    label: "Shows"
    files:
      - name: "shows"
        label: "Upcoming Shows"
        file: "assets/data/shows.json"
        fields:
          - label: "Shows"
            name: "shows"
            widget: "list"
            summary: "{{venue}}, {{city}} — {{displayDate}}"
            fields:
              - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, hint: "Used to sort and auto-hide past shows." }
              - { label: "Display date", name: "displayDate", widget: "string", hint: "How it appears on the site, e.g. 15.09.26" }
              - { label: "Venue", name: "venue", widget: "string", required: false }
              - { label: "City", name: "city", widget: "string", required: false }
              - { label: "Link", name: "link", widget: "string", required: false, hint: "Tickets or event page URL" }
              - { label: "Link label", name: "linkLabel", widget: "string", required: false, default: "Tickets" }
